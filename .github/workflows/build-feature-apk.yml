name: Build GIO BD Owner APK (feature branch only)

on:
  push:
    branches:
      - gio-bd-black-yellow-payment-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Owner JavaScript
        run: |
          node --input-type=module --check < www/admin-script.js
          node --input-type=module --check < www/appearance.js
          node --input-type=module --check < www/inbox.js

      - name: Set unique Android version code above latest Owner release
        run: |
          set -euo pipefail
          BASE_VERSION_CODE="$(grep -E '^[[:space:]]*versionCode[[:space:]]+[0-9]+' android/app/build.gradle | head -n 1 | awk '{print $2}')"
          test -n "$BASE_VERSION_CODE"
          # The main Owner build workflow has reached run 148 (latest versionCode 153).
          NEW_VERSION_CODE="$((BASE_VERSION_CODE + 148 + GITHUB_RUN_NUMBER))"
          sed -i -E "s/^([[:space:]]*versionCode[[:space:]]+)[0-9]+/\\1${NEW_VERSION_CODE}/" android/app/build.gradle
          echo "Owner Android versionCode: $NEW_VERSION_CODE"

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Restore Android release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
          test -s android/app/release-key.jks

      - name: Build signed Owner release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: release-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/GIO-BD-Owner.apk

      - name: Upload Owner APK artifact (no release or hosting deploy)
        uses: actions/upload-artifact@v4
        with:
          name: GIO-BD-Owner-Feature-Build
          path: android/app/build/outputs/apk/release/GIO-BD-Owner.apk
          if-no-files-found: error
          retention-days: 14
