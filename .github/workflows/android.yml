name: Build GIO BD Admin APK

on:
  workflow_dispatch:
  push:
    branches:
      - work/gio-owner-complete

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build web app bundle
        run: npm run build

      - name: Restore optional Firebase Android config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -e
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
            python -m json.tool android/app/google-services.json > /dev/null
          elif [ -f android/app/google-services.json ]; then
            python -m json.tool android/app/google-services.json > /dev/null
          else
            echo "Optional google-services.json not supplied; continuing with Firebase web authentication."
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify APK output
        run: |
          set -e
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          file "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/aapt" dump badging "$APK" | head -n 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GIO-BD-Admin-APK
          path: android/app/build/outputs/apk/debug/*.apk
