name: Build and Verify GIO BD Owner APK

on:
  workflow_dispatch:
  push:
    branches:
      - work/gio-owner-complete

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app bundle
        run: npm run build

      - name: Validate JavaScript
        run: node --input-type=module --check < www/admin-script.bundle.js

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
          test -s android/app/release-key.jks

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: release-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease

      - name: Verify APK package, app name and signature
        id: verify
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          unzip -t "$APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/apk-badging.txt | head -n 1
          grep -q "name='com.giobd.admin'" /tmp/apk-badging.txt
          grep -q "application-label:'GIO BD Owner'" /tmp/apk-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p release
          cp "$APK" release/GIO-BD-Owner.apk
          sha256sum release/GIO-BD-Owner.apk | tee release/SHA256SUMS.txt
          ls -lh release/GIO-BD-Owner.apk

      - name: Upload verified Owner APK
        uses: actions/upload-artifact@v4
        with:
          name: GIO-BD-Owner-Verified-APK
          path: |
            release/GIO-BD-Owner.apk
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish verified Owner APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: owner-v1.6-${{ github.run_number }}
          name: GIO BD Owner v1.6
          body: |
            GIO BD Owner APK.
            Package: com.giobd.admin
            App label: GIO BD Owner
            Release APK archive, package metadata and signature verified by CI.
          files: |
            release/GIO-BD-Owner.apk
            release/SHA256SUMS.txt
          make_latest: true
