name: Build GIO BD Owner APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GIO_BD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript modules
        run: |
          node --input-type=module --check < www/admin-script.js
          node --input-type=module --check < www/inbox.js

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Restore Android release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
          test -s android/app/release-key.jks

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: release-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Prepare Admin APK and version manifest
        run: |
          set -euo pipefail
          APK_FILE="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK_FILE"
          mkdir -p www/downloads www/updates
          cp "$APK_FILE" www/downloads/admin.apk
          VERSION_CODE="$(grep -E '^[[:space:]]*versionCode[[:space:]]+[0-9]+' android/app/build.gradle | head -n 1 | awk '{print $2}')"
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' android/app/build.gradle | head -n 1)"
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          cat > www/updates/admin-version.json <<EOF
          {
            "appId": "com.giobd.admin",
            "appName": "GIO BD Admin",
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "apkUrl": "https://gio-bd-admin.web.app/downloads/admin.apk",
            "updatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat www/updates/admin-version.json

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: GIO-BD-Admin-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Deploy Admin Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GIO_BD }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::Firebase deployment skipped. Add FIREBASE_SERVICE_ACCOUNT_GIO_BD in repository Actions secrets."
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          npm install --global firebase-tools
          firebase deploy --only hosting:admin --project gio-bd --non-interactive
