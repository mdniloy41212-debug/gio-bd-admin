name: Build GIO BD Owner APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - work/gio-owner-complete

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build Owner web bundle
        run: npm run build

      - name: Restore Firebase Android config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -e
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
            python -m json.tool android/app/google-services.json > /dev/null
          elif [ -f android/app/google-services.json ]; then
            python -m json.tool android/app/google-services.json > /dev/null
          else
            echo "Missing GOOGLE_SERVICES_JSON_BASE64 secret or android/app/google-services.json."
            exit 1
          fi
          grep -q '"project_id": "gio-bd"' android/app/google-services.json
          grep -q '"package_name": "com.giobd.admin"' android/app/google-services.json

      - name: Sync Android
        run: npx cap sync android

      - name: Build Owner APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: GIO-BD-Owner-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
