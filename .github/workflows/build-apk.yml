name: Build GIO BD Owner APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - work/gio-owner-complete

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build Owner web bundle
        run: npm run build

      - name: Validate Owner JavaScript modules
        run: |
          set -euo pipefail
          node --input-type=module --check < www/admin-script.bundle.js
          node --input-type=module --check < www/inbox.js
          grep -q 'data-admin-tab="home"' www/inbox.js
          grep -q 'data-admin-tab="inbox"' www/inbox.js
          grep -q 'data-admin-tab="settings"' www/inbox.js
          grep -q 'data-admin-tab="offers"' www/inbox.js
          grep -q 'id="gioOwnerBackButton"' www/inbox.js
          grep -q 'id="gioOwnerRefreshButton"' www/inbox.js

      - name: Restore Firebase Android config (optional for email/password login)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
            python -m json.tool android/app/google-services.json > /dev/null
            grep -q '"project_id": "gio-bd"' android/app/google-services.json
            grep -q '"package_name": "com.giobd.admin"' android/app/google-services.json
            echo "Owner Firebase Android config restored."
          elif [ -f android/app/google-services.json ]; then
            python -m json.tool android/app/google-services.json > /dev/null
            grep -q '"project_id": "gio-bd"' android/app/google-services.json
            grep -q '"package_name": "com.giobd.admin"' android/app/google-services.json
            echo "Using repository Owner Firebase Android config."
          else
            echo "::warning::No Owner google-services.json found. APK can build, but native Google Sign-In must not be considered verified until the correct com.giobd.admin Firebase Android config is added."
          fi
      - name: Sync Android
        run: npx cap sync android

      - name: Restore Owner release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::Add ANDROID_KEYSTORE_BASE64 to the Owner repository secrets."; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
          test -s android/app/release-key.jks

      - name: Verify release signing key
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          keytool -list -v -keystore android/app/release-key.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | grep -E 'SHA1:|SHA256:'

      - name: Set Owner app version
        run: |
          set -euo pipefail
          sed -i 's/versionCode 7/versionCode 8/' android/app/build.gradle
          sed -i 's/versionName "1.5"/versionName "1.6"/' android/app/build.gradle

      - name: Build signed Owner Release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: release-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > /tmp/owner-apk-badging.txt
          grep -q "name='com.giobd.admin'" /tmp/owner-apk-badging.txt
          grep -q "application-label:'GIO BD Owner'" /tmp/owner-apk-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p ../release
          cp "$APK" ../release/GIO-BD-Owner.apk
          sha256sum ../release/GIO-BD-Owner.apk > ../release/SHA256SUMS.txt

      - name: Upload signed Owner APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GIO-BD-Owner-APK-Artifact
          path: |
            release/GIO-BD-Owner.apk
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish Owner APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: owner-v1.6-8-${{ github.run_number }}
          name: GIO BD Owner v1.6 (Build ${{ github.run_number }})
          body: |
            GIO BD Owner signed Android release.
            Version: 1.6
            Version code: 8
            Package: com.giobd.admin
            App name: GIO BD Owner
            APK archive integrity and release signature verified during build.
          files: |
            release/GIO-BD-Owner.apk
            release/SHA256SUMS.txt
          make_latest: true
